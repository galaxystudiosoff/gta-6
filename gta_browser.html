<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GTA Browser Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #ffcc00; text-transform: uppercase; }
        p { margin: 5px 0; font-size: 14px; }
        .key { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <h1>Mini GTA Web</h1>
    <p><span class="key">W, A, S, D</span> — Движение / Вождение</p>
    <p><span class="key">F</span> — Сесть в машину / Выйти</p>
    <p>Найди машину и угони её!</p>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Настройка размера экрана
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Игровые константы
    const WORLD_SIZE = 4000;
    const TILE_SIZE = 100;
    
    // Камера
    const camera = { x: 0, y: 0 };

    // Игрок
    const player = {
        x: WORLD_SIZE / 2,
        y: WORLD_SIZE / 2,
        radius: 12,
        speed: 4,
        angle: 0,
        inCar: false,
        carIndex: -1,
        color: '#fff'
    };

    // Машины
    const cars = [];
    const carColors = ['#ff3333', '#3333ff', '#33ff33', '#ffff33', '#ff33ff', '#33ffff'];

    // Генерация города (здания)
    const buildings = [];
    for (let i = 0; i < 300; i++) {
        buildings.push({
            x: Math.random() * WORLD_SIZE,
            y: Math.random() * WORLD_SIZE,
            w: 50 + Math.random() * 150,
            h: 50 + Math.random() * 150,
            color: `rgb(${30 + Math.random()*50}, ${30 + Math.random()*50}, ${40 + Math.random()*50})`
        });
    }

    // Генерация машин
    for (let i = 0; i < 50; i++) {
        spawnCar();
    }

    function spawnCar() {
        cars.push({
            x: Math.random() * WORLD_SIZE,
            y: Math.random() * WORLD_SIZE,
            w: 40,
            h: 70,
            angle: Math.random() * Math.PI * 2,
            speed: 0,
            maxSpeed: 12,
            acceleration: 0.2,
            friction: 0.96,
            turnSpeed: 0.06,
            color: carColors[Math.floor(Math.random() * carColors.length)],
            driver: null
        });
    }

    // Управление
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        if (e.code === 'KeyF') handleInteraction();
    });

    function handleInteraction() {
        if (player.inCar) {
            // Выход из машины
            const car = cars[player.carIndex];
            player.x = car.x - 60;
            player.y = car.y;
            player.inCar = false;
            player.carIndex = -1;
            car.driver = null;
        } else {
            // Попытка сесть в машину
            for (let i = 0; i < cars.length; i++) {
                const car = cars[i];
                const dx = player.x - car.x;
                const dy = player.y - car.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 60) {
                    player.inCar = true;
                    player.carIndex = i;
                    car.driver = player;
                    break;
                }
            }
        }
    }

    function update() {
        if (player.inCar) {
            const car = cars[player.carIndex];
            
            // Логика вождения
            if (keys['KeyW']) car.speed += car.acceleration;
            if (keys['KeyS']) car.speed -= car.acceleration;
            
            // Поворот только если машина едет
            if (Math.abs(car.speed) > 0.5) {
                const dir = car.speed > 0 ? 1 : -1;
                if (keys['KeyA']) car.angle -= car.turnSpeed * dir;
                if (keys['KeyD']) car.angle += car.turnSpeed * dir;
            }

            // Физика машины
            car.speed *= car.friction;
            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;

            // Ограничение мира
            car.x = Math.max(0, Math.min(WORLD_SIZE, car.x));
            car.y = Math.max(0, Math.min(WORLD_SIZE, car.y));

            // Синхронизация игрока с машиной
            player.x = car.x;
            player.y = car.y;
            
            // Камера следует за машиной
            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

        } else {
            // Логика пешехода
            let dx = 0;
            let dy = 0;
            if (keys['KeyW']) dy = -1;
            if (keys['KeyS']) dy = 1;
            if (keys['KeyA']) dx = -1;
            if (keys['KeyD']) dx = 1;

            if (dx !== 0 || dy !== 0) {
                player.angle = Math.atan2(dy, dx);
                player.x += Math.cos(player.angle) * player.speed;
                player.y += Math.sin(player.angle) * player.speed;
            }

            // Ограничение мира
            player.x = Math.max(0, Math.min(WORLD_SIZE, player.x));
            player.y = Math.max(0, Math.min(WORLD_SIZE, player.y));

            // Камера следует за игроком (плавнее)
            camera.x += (player.x - canvas.width / 2 - camera.x) * 0.1;
            camera.y += (player.y - canvas.height / 2 - camera.y) * 0.1;
        }
        
        // Коллизия со зданиями (простая)
        checkCollisions(player.inCar ? cars[player.carIndex] : player);
    }

    function checkCollisions(entity) {
        // Упрощенная коллизия: если центр внутри здания - отталкиваем
        for (let b of buildings) {
            if (entity.x > b.x && entity.x < b.x + b.w &&
                entity.y > b.y && entity.y < b.y + b.h) {
                
                if (player.inCar) {
                    const car = cars[player.carIndex];
                    car.speed *= -0.5; // Удар об стену
                    car.x -= Math.sin(car.angle) * 5;
                    car.y += Math.cos(car.angle) * 5;
                } else {
                    entity.x -= Math.cos(entity.angle) * 5;
                    entity.y -= Math.sin(entity.angle) * 5;
                }
            }
        }
    }

    function draw() {
        // Очистка фона (асфальт)
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Рисуем границы мира
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 10;
        ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        // Рисуем здания
        for (let b of buildings) {
            // Оптимизация: рисуем только то, что в камере
            if (b.x + b.w < camera.x || b.x > camera.x + canvas.width ||
                b.y + b.h < camera.y || b.y > camera.y + canvas.height) continue;

            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            
            // Крыша (эффект 3D)
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(b.x + 10, b.y + 10, b.w - 20, b.h - 20);
        }

        // Рисуем машины
        for (let i = 0; i < cars.length; i++) {
            const car = cars[i];
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Тень
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-car.w/2 + 5, -car.h/2 + 5, car.w, car.h);

            // Корпус
            ctx.fillStyle = car.color;
            ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
            
            // Стекла
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.w/2 + 2, -car.h/2 + 10, car.w - 4, 15); // Лобовое
            ctx.fillRect(-car.w/2 + 2, car.h/2 - 20, car.w - 4, 10); // Заднее

            // Фары
            ctx.fillStyle = '#ffffaa';
            ctx.fillRect(-car.w/2 + 2, -car.h/2, 10, 5);
            ctx.fillRect(car.w/2 - 12, -car.h/2, 10, 5);

            ctx.restore();
        }

        // Рисуем игрока (если не в машине)
        if (!player.inCar) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Тело
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Плечи/Руки
            ctx.fillStyle = '#ccc';
            ctx.fillRect(-5, -15, 10, 30);

            ctx.restore();
        }

        ctx.restore();
        
        requestAnimationFrame(loop);
    }

    function loop() {
        update();
        draw();
    }

    // Запуск
    loop();

    // Ресайз окна
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

</script>
</body>
</html>
